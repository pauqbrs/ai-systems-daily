name: Publicar y desplegar

# Se dispara en dos casos:
#  - push a main: publicación normal (una persona editando directamente).
#  - push a claude/**: la rutina diaria y cualquier trabajo agéntico.
#
# La rutina NO puede empujar a main. Las rutinas solo pueden escribir sin
# fricción en ramas con prefijo `claude/`, y además un push a main se rechaza
# cuando la rama tiene commits de un autor distinto al dueño de la rutina —
# que es el caso aquí. Así que la rutina empuja su rama y el job `promocionar`
# la lleva a main usando el GITHUB_TOKEN del repo, que sí tiene permiso.
on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Un despliegue a la vez. No cancelamos el que está en curso: si se empujan
# dos ediciones seguidas, queremos que ambas terminen en orden.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  promocionar:
    # Solo para las ramas de la rutina. Deja main con la edición nueva.
    if: startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Llevar la edición a main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          # --no-ff deja constancia de qué edición entró y cuándo.
          git merge --no-ff "${GITHUB_SHA}" -m "Publica ${GITHUB_REF_NAME}"
          git push origin main

  build:
    needs: [promocionar]
    # `always()` para que el build corra también en los push directos a main,
    # donde `promocionar` se salta. Sin esto, un job saltado bloquea el resto.
    if: always() && needs.promocionar.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tras promocionar, lo que hay que construir es main, no la rama.
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # El build valida el contenido contra los esquemas de content.config.ts.
      # Si una edición generada está mal formada, falla aquí y no se publica.
      - run: bun run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    # `promocionar` se salta en los push a main y en workflow_dispatch, y
    # Actions propaga ese «skipped» a todo lo que cuelga de él: `build` se
    # salvaba con su `always()`, pero `deploy` heredaba la condición implícita
    # `success()`, que exige que TODOS los needs transitivos hayan pasado. El
    # resultado era un run entero en verde con el deploy saltado y el sitio
    # congelado. Hay que mirar el resultado de `build` explícitamente.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
